<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Apple SD Gothic Neo, Noto Sans KR, -apple-system, Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="#ffffff"/>
<text x="30" y="38" font-size="19" font-weight="700" fill="#cf222e">Before: macOS default "1680×1050" (not HiDPI)</text>
<rect x="30" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="130.0" y="86.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">macOS draws</text>
<text x="130.0" y="108.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1680×1050 px</text>
<text x="130.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1x, no Retina</text>
<line x1="234" y1="108.0" x2="258" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M266 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="270" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="370.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Cable</text>
<text x="370.0" y="119.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1680×1050</text>
<line x1="474" y1="108.0" x2="498" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M506 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="510" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="610.0" y="86.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Monitor scaler</text>
<text x="610.0" y="108.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">stretches to 2560×1600</text>
<text x="610.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">×1.52, not a whole number</text>
<line x1="714" y1="108.0" x2="738" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M746 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="750" y="60" width="200" height="96" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="850.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Blurry text</text>
<text x="850.0" y="119.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">soft, smeared edges</text>
<text x="30" y="208" font-size="19" font-weight="700" fill="#1a7f37">With PortableHiDPI: "1680×1050" HiDPI</text>
<rect x="30" y="230" width="200" height="96" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="130.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Virtual display</text>
<text x="130.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">3360×2100 px</text>
<text x="130.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">looks like 1680×1050 (2x)</text>
<line x1="234" y1="278.0" x2="258" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M266 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="270" y="230" width="200" height="96" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="370.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Hardware mirror</text>
<text x="370.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">GPU scales down</text>
<text x="370.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">3360 → 2560 (×0.76)</text>
<line x1="474" y1="278.0" x2="498" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M506 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="510" y="230" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="610.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Real monitor</text>
<text x="610.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">driven at 2560×1600</text>
<text x="610.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">panel's own pixels, 1:1</text>
<line x1="714" y1="278.0" x2="738" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M746 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="750" y="230" width="200" height="96" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="850.0" y="267.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">Sharp text</text>
<text x="850.0" y="289.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">same size, Retina-like</text>
<text x="500.0" y="372" text-anchor="middle" font-size="15" fill="#57606a">Shrinking a 2x image keeps detail; stretching a 1x image cannot add it.</text>
</svg>