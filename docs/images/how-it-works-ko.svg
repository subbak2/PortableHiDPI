<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Apple SD Gothic Neo, Noto Sans KR, -apple-system, Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="#ffffff"/>
<text x="30" y="38" font-size="19" font-weight="700" fill="#cf222e">기존: macOS 기본 "1680×1050" (HiDPI 아님)</text>
<rect x="30" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="130.0" y="86.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">macOS가 그림</text>
<text x="130.0" y="108.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1680×1050 픽셀</text>
<text x="130.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1배, 레티나 아님</text>
<line x1="234" y1="108.0" x2="258" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M266 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="270" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="370.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">케이블</text>
<text x="370.0" y="119.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1680×1050</text>
<line x1="474" y1="108.0" x2="498" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M506 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="510" y="60" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="610.0" y="86.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">모니터 스케일러</text>
<text x="610.0" y="108.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">2560×1600으로 늘림</text>
<text x="610.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1.52배, 정수배가 아님</text>
<line x1="714" y1="108.0" x2="738" y2="108.0" stroke="#57606a" stroke-width="2.5"/><path d="M746 108.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="750" y="60" width="200" height="96" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="850.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">흐릿한 글씨</text>
<text x="850.0" y="119.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">획 경계가 번짐</text>
<text x="30" y="208" font-size="19" font-weight="700" fill="#1a7f37">PortableHiDPI: "1680×1050" HiDPI</text>
<rect x="30" y="230" width="200" height="96" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="130.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">가상 디스플레이</text>
<text x="130.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">3360×2100 픽셀</text>
<text x="130.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">1680×1050처럼 보임 (2배)</text>
<line x1="234" y1="278.0" x2="258" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M266 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="270" y="230" width="200" height="96" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="370.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">하드웨어 미러링</text>
<text x="370.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">GPU가 축소</text>
<text x="370.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">3360 → 2560 (0.76배)</text>
<line x1="474" y1="278.0" x2="498" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M506 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="510" y="230" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="610.0" y="256.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">실제 모니터</text>
<text x="610.0" y="278.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">2560×1600으로 출력</text>
<text x="610.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">패널 픽셀 그대로 1:1</text>
<line x1="714" y1="278.0" x2="738" y2="278.0" stroke="#57606a" stroke-width="2.5"/><path d="M746 278.0 l-10 -6 v12 z" fill="#57606a"/>
<rect x="750" y="230" width="200" height="96" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="850.0" y="267.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2328">선명한 글씨</text>
<text x="850.0" y="289.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#1f2328">크기는 같고 레티나처럼</text>
<text x="500.0" y="372" text-anchor="middle" font-size="15" fill="#57606a">2배로 그린 걸 줄이면 디테일이 남고, 1배를 늘리면 없는 디테일이 생기지 않는다.</text>
</svg>